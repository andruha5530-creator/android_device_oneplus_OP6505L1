name: TWRP Recovery Compiler

on:
  push:
    branches: [ twrp-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          uname -a
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex fontconfig gperf \
            git gnupg imagemagick lib32z1-dev libc6-dev-i386 \
            libgl1-mesa-dev libssl-dev libxml2-utils libx11-dev \
            lzop openjdk-11-jdk pngcrush python3 rsync schedtool \
            squashfs-tools unzip xsltproc zip zlib1g-dev
          df -h

      - name: Sync TWRP 12.1
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          repo --version

          mkdir -p "$HOME/twrp-12.1"
          cd "$HOME/twrp-12.1"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -j2 --force-sync --no-clone-bundle --no-tags

      - name: Add device tree
        run: |
          mkdir -p "$HOME/twrp-12.1/device/oneplus"
          git clone --depth=1 --branch twrp-build "https://github.com/$GITHUB_REPOSITORY.git" "$HOME/twrp-12.1/device/oneplus/OP6505L1"

      - name: Validate TWRP device tree
        run: |
          set -eo pipefail
          cd "$HOME/twrp-12.1"
          export TOP="$HOME/twrp-12.1"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          test -f "$TOP/build/make/core/envsetup.mk"
          echo "=== DEVICE TREE ==="
          sed -n '1,260p' device/oneplus/OP6505L1/AndroidProducts.mk
          sed -n '1,320p' device/oneplus/OP6505L1/BoardConfig.mk
          sed -n '1,260p' device/oneplus/OP6505L1/twrp_OP6505L1.mk

          source build/envsetup.sh
          lunch twrp_OP6505L1-eng

          echo "=== BUILD VARS ==="
          get_build_var TARGET_PRODUCT
          get_build_var TARGET_BUILD_VARIANT
          get_build_var BOARD_RECOVERYIMAGE_PARTITION_SIZE
          get_build_var BOARD_BOOT_HEADER_VERSION
          get_build_var BOARD_KERNEL_PAGESIZE
          get_build_var BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE
          get_build_var BOARD_USES_GENERIC_KERNEL_IMAGE
          get_build_var TARGET_RECOVERY_FSTAB

      - name: Build TWRP recovery
        run: |
          set -o pipefail
          cd "$HOME/twrp-12.1"
          export TOP="$HOME/twrp-12.1"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source "$TOP/build/envsetup.sh"
          lunch twrp_OP6505L1-eng

          OUT="$TOP/out/target/product/OP6505L1"
          LOG="$GITHUB_WORKSPACE/build.log"

          echo "=== TWRP BUILD (PASS 1) ==="
          set +e
          mka recoveryimage -j2 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # TWRP 12.1 currently has an open issue for this exact rsync
          # failure. The recovery build can leave root/vendor as a directory
          # while the next packaging step expects the vendor symlink.
          # Match the minimal workaround used by other recovery builds:
          # remove only the conflicting generated directory and rerun the
          # failed recovery packaging target.
          if grep -qE 'could not make way for new symlink: root/vendor|cannot delete non-empty directory: root/vendor' "$LOG"; then
            echo "=== DETECTED root/vendor SYMLINK CONFLICT ==="
            rm -rf "$OUT/recovery/root/vendor"

            echo "=== RETRY RECOVERY RAMDISK PACKAGING ==="
            ninja -C "$TOP" "$OUT/obj/PACKAGING/recovery_intermediates/ramdisk_files-timestamp" 2>&1 | tee -a "$LOG"

            echo "=== RETRY TWRP RECOVERY IMAGE ==="
            mka recoveryimage -j2 2>&1 | tee -a "$LOG"
            exit ${PIPESTATUS[0]}
          fi

          exit "$status"

      - name: Verify recovery image
        run: |
          OUT="$HOME/twrp-12.1/out/target/product/OP6505L1"
          test -f "$OUT/recovery.img"
          ls -lh "$OUT/recovery.img"
          file "$OUT/recovery.img"
          python3 - "$OUT/recovery.img" <<'PY'
          import struct, sys
          p=sys.argv[1]
          d=open(p,'rb').read(4096)
          if d[:8] != b'ANDROID!':
              raise SystemExit("ERROR: not an Android boot image")
          print("kernel_size=", struct.unpack_from("<I", d, 8)[0])
          print("ramdisk_size=", struct.unpack_from("<I", d, 16)[0])
          print("header_version=", struct.unpack_from("<I", d, 40)[0])
          print("header_size=", struct.unpack_from("<I", d, 1648)[0] if len(d) >= 1652 else "n/a")
          PY

      - name: Upload TWRP recovery
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-OnePlus-Nord-CE-6-OP6505L1
          path: |
            ~/twrp-12.1/out/target/product/OP6505L1/recovery.img
            build.log
          if-no-files-found: error
