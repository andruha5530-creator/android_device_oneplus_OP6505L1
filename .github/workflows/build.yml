name: OrangeFox Recovery Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Подготовка Linux-окружения
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc zip cpio python3 git curl

    - name: Прямое скачивание исходников OrangeFox
      run: |
        cd ~
        git config --global user.name "andruha5530"
        git config --global user.email "andruha5530@example.com"
        # Скачиваем стабильную ветку Fox напрямую через Git (без утилиты repo)
        git clone --depth=1 https://github.com -b fox_12.1 ~/fox_12.1

    - name: Клонирование вашего дерева устройства
      run: |
        cd ~/fox_12.1/device
        mkdir -p oneplus
        cd oneplus
        # Подтягиваем созданные вами .mk файлы из текущего репозитория
        git clone https://github.com{{ github.repository_owner }}/android_device_oneplus_OP6505L1.git OP6505L1

    - name: Компиляция OrangeFox Recovery
      run: |
        cd ~/fox_12.1
        source build/envsetup.sh
        lunch omni_OP6505L1-eng
        mka recoveryimage

    - name: Выгрузка готового рекавери в артефакты
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-OnePlus-Nord-CE-6
        path: ~/fox_12.1/out/target/product/OP6505L1/*.img
