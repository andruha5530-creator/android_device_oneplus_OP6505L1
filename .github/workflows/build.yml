name: OrangeFox Recovery Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Reclaim disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show runner
        run: |
          uname -a
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev python3 openjdk-11-jdk
          df -h

      - name: Sync OrangeFox 12.1
        run: |
          mkdir -p "$HOME/OrangeFox_sync"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/OrangeFox_sync"
          "$HOME/OrangeFox_sync/orangefox_sync.sh" --branch 12.1 --path "$HOME/fox_12.1"
          df -h "$HOME/fox_12.1"

      - name: Add device tree
        run: |
          mkdir -p "$HOME/fox_12.1/device/oneplus"
          git clone --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$HOME/fox_12.1/device/oneplus/OP6505L1"

      - name: Validate device tree
        run: |
          cd "$HOME/fox_12.1"
          test -f device/oneplus/OP6505L1/AndroidProducts.mk
          test -f device/oneplus/OP6505L1/omni_OP6505L1.mk
          test -f device/oneplus/OP6505L1/BoardConfig.mk
          test -f device/oneplus/OP6505L1/recovery/root/system/etc/recovery.fstab
          source build/envsetup.sh
          lunch omni_OP6505L1-eng
          get_build_var BOARD_RECOVERYIMAGE_PARTITION_SIZE
          get_build_var BOARD_BOOT_HEADER_VERSION
          get_build_var TARGET_RECOVERY_FSTAB

      - name: Build recovery.img
        run: |
          cd "$HOME/fox_12.1"
          source build/envsetup.sh
          lunch omni_OP6505L1-eng
          mka adbd recoveryimage

      - name: Verify recovery image
        run: |
          IMG="$HOME/fox_12.1/out/target/product/OP6505L1/recovery.img"
          test -f "$IMG"
          ls -lh "$IMG"
          file "$IMG"

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-OnePlus-Nord-CE-6-OP6505L1
          path: ~/fox_12.1/out/target/product/OP6505L1/recovery.img
          if-no-files-found: error
