name: OrangeFox Recovery Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          uname -a
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex fontconfig gperf \
            git gnupg imagemagick lib32z1-dev libc6-dev-i386 \
            libgl1-mesa-dev libssl-dev libxml2-utils libx11-dev \
            lzop openjdk-11-jdk pngcrush python3 rsync schedtool \
            squashfs-tools unzip xsltproc zip zlib1g-dev
          df -h

      - name: Sync OrangeFox 12.1
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          repo --version

          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/OrangeFox_sync"
          chmod +x "$HOME/OrangeFox_sync/orangefox_sync.sh"
          mkdir -p "$GITHUB_WORKSPACE/patches"
          cp "$HOME/OrangeFox_sync"/patches/patch-*-fox_12.1.diff "$GITHUB_WORKSPACE/patches/"
          ls -lh "$GITHUB_WORKSPACE/patches/"
          test -f "$GITHUB_WORKSPACE/patches/patch-manifest-fox_12.1.diff"
          test -f "$GITHUB_WORKSPACE/patches/patch-update-engine-fox_12.1.diff"
          cd "$GITHUB_WORKSPACE"
          "$HOME/OrangeFox_sync/orangefox_sync.sh" --branch 12.1 --path "$HOME/fox_12.1"
          df -h "$HOME/fox_12.1"

      - name: Add device tree
        run: |
          mkdir -p "$HOME/fox_12.1/device/oneplus"
          git clone --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$HOME/fox_12.1/device/oneplus/OP6505L1"

      - name: Validate device tree
        run: |
          set -eo pipefail
          cd "$HOME/fox_12.1"
          export TOP="$HOME/fox_12.1"
          test -f "$TOP/build/make/core/envsetup.mk"
          echo "ANDROID_BUILD_TOP=$TOP"

          echo "=== DEVICE TREE ==="
          sed -n '1,240p' device/oneplus/OP6505L1/AndroidProducts.mk
          sed -n '1,260p' device/oneplus/OP6505L1/omni_OP6505L1.mk
          sed -n '1,320p' device/oneplus/OP6505L1/BoardConfig.mk
          sed -n '1,260p' device/oneplus/OP6505L1/vendorsetup.sh

          echo "=== ENVSETUP ==="
          set +e
          set -x
          source build/envsetup.sh
          envsetup_rc=$?
          set +x
          set -e
          echo "ENVSETUP_RC=$envsetup_rc"
          printf "TOP=%s\nANDROID_BUILD_TOP=%s\nBASH_VERSION=%s\n" "${TOP:-}" "${ANDROID_BUILD_TOP:-}" "${BASH_VERSION:-}"
          if ! declare -F lunch >/dev/null 2>&1; then
            echo "ERROR: lunch function was not loaded by envsetup.sh"
            exit "$envsetup_rc"
          fi

          echo "=== COMMON LUNCH CHOICES ==="
          TARGET_BUILD_APPS= TARGET_PRODUCT= TARGET_BUILD_VARIANT= get_build_var COMMON_LUNCH_CHOICES || true

          echo "=== LUNCH TRACE ==="
          set +e
          set -x
          lunch omni_OP6505L1-eng
          lunch_rc=$?
          set +x
          set -e
          echo "LUNCH_RC=$lunch_rc"

          echo "=== BUILD VARS ==="
          get_build_var TARGET_PRODUCT
          get_build_var TARGET_BUILD_VARIANT
          get_build_var TARGET_BUILD_TYPE
          get_build_var BOARD_RECOVERYIMAGE_PARTITION_SIZE
          get_build_var BOARD_BOOT_HEADER_VERSION
          get_build_var BOARD_BOOTIMG_HEADER_VERSION
          get_build_var BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE
          get_build_var TARGET_NO_KERNEL
          get_build_var BOARD_USES_GENERIC_KERNEL_IMAGE
          get_build_var TARGET_RECOVERY_FSTAB

          if [ "$lunch_rc" -ne 0 ]; then
            echo "=== LUNCH FAILED: DUMPING AVAILABLE PRODUCTS ==="
            TARGET_BUILD_APPS= TARGET_PRODUCT= TARGET_BUILD_VARIANT= get_build_var COMMON_LUNCH_CHOICES || true
            echo "=== LUNCH FAILURE CONTEXT ==="
            get_build_var PRODUCT_MAKEFILES || true
            get_build_var COMMON_LUNCH_CHOICES || true
          fi
          exit "$lunch_rc"

      - name: Build recovery
        run: |
          cd "$HOME/fox_12.1"
          export TOP="$HOME/fox_12.1"
          test -f "$TOP/build/make/core/envsetup.mk"
          set +e
          set -x
          source "$TOP/build/envsetup.sh"
          envsetup_rc=$?
          set +x
          set -e
          echo "ENVSETUP_RC=$envsetup_rc"
          declare -F lunch
          lunch omni_OP6505L1-eng
          mka recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify recovery image
        run: |
          set -euo pipefail
          OUT="$HOME/fox_12.1/out/target/product/OP6505L1"
          IMG="$OUT/recovery.img"

          test -f "$IMG"
          ls -lh "$IMG"
          file "$IMG"

          echo "=== RECOVERY SHA-256 ==="
          sha256sum "$IMG"

          echo "=== RECOVERY BOOT HEADER ==="
          python3 - "$IMG" <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "rb") as f:
              data = f.read(4096)

          if data[:8] != b"ANDROID!":
              raise SystemExit("ERROR: invalid Android boot image magic")

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          ramdisk_size = struct.unpack_from("<I", data, 16)[0]
          page_size = struct.unpack_from("<I", data, 36)[0]
          header_version = struct.unpack_from("<I", data, 40)[0]

          print(f"kernel_size={kernel_size}")
          print(f"ramdisk_size={ramdisk_size}")
          print(f"page_size={page_size}")
          print(f"header_version={header_version}")

          if header_version != 4:
              raise SystemExit("ERROR: recovery header is not v4")
          if page_size != 4096:
              raise SystemExit("ERROR: unexpected recovery page size")
          if kernel_size != 0:
              raise SystemExit("ERROR: recovery unexpectedly contains a kernel")
          if ramdisk_size == 0:
              raise SystemExit("ERROR: recovery ramdisk is empty")
          PY

          echo "=== RECOVERY PARTITION SIZE CHECK ==="
          SIZE="$(stat -c '%s' "$IMG")"
          MAX_SIZE=104857600
          echo "recovery.img=$SIZE bytes"
          test "$SIZE" -le "$MAX_SIZE"

          echo "=== AVB FOOTER CHECK ==="
          python3 - "$IMG" <<'PY'
          import sys

          path = sys.argv[1]
          with open(path, "rb") as f:
              f.seek(0, 2)
              size = f.tell()
              f.seek(max(0, size - 256))
              tail = f.read(256)

          if b"AVBf" in tail:
              print("AVB footer present")
          else:
              print("AVB footer absent (OEM signing is not reproduced by this build)")
          PY

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-OnePlus-Nord-CE-6-OP6505L1
          path: |
            ~/fox_12.1/out/target/product/OP6505L1/recovery.img
            build.log
          if-no-files-found: error
